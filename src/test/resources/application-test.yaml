# Test profile configuration.
#
# Background jobs are pushed out of reach rather than configured normally, because a test must not
# depend on one running, nor be disturbed by one that does.
#
# The rate limiter is a production protection backed by Redis; without disabling it the
# login/register flows intermittently fail when the limiter is briefly unavailable under the
# parallel test run.
#
# The leaderboard score backfill recomputes every user's ranking scores. Inside a test run it would
# rewrite Redis and the database while assertions about ranks and participant counts are in flight,
# and each Spring context starts against a fresh Redis, so its "already done" marker would not stop
# it either. A day-long initial delay keeps it out of a test run entirely.
ctt:
  security:
    jwt:
      secret-key: TEST_ONLY_JWT_SECRET_KEY_MUST_BE_AT_LEAST_256_BITS_LONG_FOR_TEST
    rate-limit:
      enabled: false
    two-factor:
      encryption-key: "MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY="
    oauth:
      token-encryption-key: "MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY="
  leaderboard:
    backfill-initial-delay-ms: 86400000
#
# Every cached Spring context would otherwise try to bind the same fixed management port. A random
# loopback port keeps the dedicated management server shape of production while letting contexts
# coexist; ActuatorSurfaceTest asserts that surface. The address stays at the profile default
# 127.0.0.1, which differs from the unset server.address and therefore starts a separate server.
management:
  server:
    port: 0
  tracing:
    # Tests assert the trace identifier and the log correlation, never an export: a background
    # exporter would retry against a collector that does not exist and slow every context down.
    export:
      enabled: false
