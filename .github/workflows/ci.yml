name: CI

# Every gate the release chain depends on runs here, on the same tree a merge
# would produce: formatting, the full test suite, the coverage thresholds, the
# secret scan, the dependency and filesystem scan, the image scan, an SBOM and
# the build provenance attestation. A pull request is red exactly when one of
# them fails; a gate that is red on a technicality gets switched off, so each
# step below fails only for the thing it measures.
on:
  pull_request:
  push:
    branches: [develop, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Pinned, not `latest`: a scanner that changes under the repository would make
  # yesterday's green build un-reproducible. Renovate carries the configuration
  # (.github/renovate.json), but its app is not installed on this repository yet,
  # so until it is these pins move by hand.
  GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1
  TRIVY_IMAGE: aquasec/trivy:0.76.2
  SOPS_VERSION: v3.13.3
  IMAGE_TAG: ctt-server:ci
  # Anonymous Docker Hub pulls are limited per source address, and the runners
  # share them, so `postgres:latest` can answer "toomanyrequests" before a single
  # test starts. Testcontainers rewrites the hub prefix for every image it pulls,
  # Ryuk included, and Google's mirror serves the same tags.
  TESTCONTAINERS_HUB_IMAGE_NAME_PREFIX: mirror.gcr.io/

jobs:
  # Docs-only pull requests do not need a five-minute suite: nothing they touch
  # can change behaviour. The classifier runs first and every gate below reads
  # its answer, so the decision lives in one place instead of three.
  changes:
    name: Classify the change
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.classify.outputs.code }}
      migrations: ${{ steps.classify.outputs.migrations }}
    steps:
      # Only a pull request needs the diff; a push answers `code=true` before
      # touching git, so cloning the history there would be pure cost.
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0

      - name: Decide whether the gates are needed
        id: classify
        run: |
          set -euo pipefail
          # Everything that is not documentation is code for this purpose. Being
          # generous here only costs time; being generous in the other direction
          # would let a workflow or dependency change merge untested.
          if [ "${GITHUB_EVENT_NAME}" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "migrations=true" >> "$GITHUB_OUTPUT"
            echo "not a pull request: every gate runs"
            exit 0
          fi
          base="${{ github.event.pull_request.base.sha }}"
          git fetch --no-tags --depth=1 origin "$base"
          docs_only=true
          migrations=false
          while IFS= read -r file; do
            # The schema a running version must survive, plus the gates and the
            # wiring that decide whether anything checks it.
            case "$file" in
              src/main/resources/db/migration/* | scripts/check-migrations.sh | \
                scripts/migration-coexistence-drill.sh | scripts/tests/check-migrations-test.sh | \
                scripts/preflight.sh | .github/workflows/ci.yml)
                migrations=true
                ;;
            esac
            case "$file" in
              *.md|docs/*|.plans/*|memory-bank/*) ;;
              *) docs_only=false ;;
            esac
          done < <(git diff --name-only "$base" HEAD)
          echo "migrations=$migrations" >> "$GITHUB_OUTPUT"
          if [ "$docs_only" = true ]; then
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "documentation only: the suite, the scans and the image build are skipped"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi

  quality:
    name: Format, tests and coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: changes
    # The job always runs even when the classifier fails, because a skipped
    # required check counts as passing and this gate must never pass by accident.
    if: always()
    steps:
      - name: Fail closed when the classifier did not finish
        if: needs.changes.result != 'success'
        run: |
          echo "the change classifier did not finish, so this gate cannot be skipped" >&2
          exit 1

      - uses: actions/checkout@v7
        if: needs.changes.outputs.code == 'true'

      - uses: actions/setup-java@v6
        if: needs.changes.outputs.code == 'true'
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      # A formatting failure is a one-line fix, so it fails first and fast
      # instead of after a four-minute suite.
      - name: Check formatting
        if: needs.changes.outputs.code == 'true'
        run: .github/scripts/gradle-retry.sh spotlessCheck

      - name: Build and test
        if: needs.changes.outputs.code == 'true'
        run: |
          # The suite starts real PostgreSQL and Redis. Pulling them first keeps
          # a registry hiccup from surfacing as a test failure.
          docker pull postgres:latest
          docker pull redis:latest
          # `build` runs `check`, which now depends on the coverage verification.
          .github/scripts/gradle-retry.sh build jacocoTestReport

      - name: Publish test and coverage reports
        if: always() && needs.changes.outputs.code == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: reports-${{ github.sha }}
          path: |
            build/reports/tests/
            build/test-results/
            build/reports/jacoco/
            build/gradle.log
          retention-days: 14

  # A migration is the only change that can break the version already serving
  # traffic without touching a line of Java. Two gates, because they catch
  # different mistakes: the files that have shipped are immutable, and the
  # previous release keeps working after the new one migrates the same database.
  migrations:
    name: Migration compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: changes
    # Same reason as the quality job: a skipped required check counts as
    # passing, and this gate must never pass by accident.
    if: always()
    steps:
      - name: Fail closed when the classifier did not finish
        if: needs.changes.result != 'success'
        run: |
          echo "the change classifier did not finish, so this gate cannot be skipped" >&2
          exit 1

      - uses: actions/checkout@v7
        if: needs.changes.outputs.code == 'true'
        with:
          # The immutability check compares against the released branch, which
          # only exists locally when the full history is present.
          fetch-depth: 0

      - uses: actions/setup-java@v6
        if: needs.changes.outputs.code == 'true'
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      # Seconds, and it names the offending file and statement.
      - name: Migrations are immutable and the running version survives them
        if: needs.changes.outputs.code == 'true'
        run: ./scripts/check-migrations.sh

      # The gate's failure mode is a green verdict, so its own cases run here:
      # a wrapped statement or a block comment must not slip past it.
      - name: The static check still catches what it claims to
        if: needs.changes.outputs.code == 'true'
        run: ./scripts/tests/check-migrations-test.sh

      # Minutes, and it is the only check that proves the old colour survives.
      # Only a range that touches a migration can break the running colour, so
      # the drill follows the classifier; the static check above always runs.
      - name: The previous release still serves on the migrated schema
        if: needs.changes.outputs.code == 'true' && needs.changes.outputs.migrations == 'true'
        run: ./scripts/migration-coexistence-drill.sh

  secrets:
    name: Render secrets with the CI age identity
    runs-on: ubuntu-24.04
    # A pull request from a fork runs without repository secrets, so this job
    # skips there. A skipped required check counts as passing, whereas a job
    # that runs and fails would make outside contributions unmergeable.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # The repository's own installer, not a hand-copied release URL: it holds
      # the asset-name table and the checksums check, so this job cannot drift
      # from what the runbook tells an operator to run. The prefix is outside
      # the work tree — anything written into it would show up in the
      # `git status` check below and fail the job for its own tooling.
      - name: Install sops
        run: |
          set -euo pipefail
          scripts/install.sh --tool sops --version "${SOPS_VERSION}" --prefix "${RUNNER_TEMP}/bin"
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"

      # The identity is the one thing the runner must hold. It arrives as a
      # secret and is written to the path render.sh already understands, so the
      # script needs no CI-specific branch.
      - name: Write the age identity
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SOPS_AGE_KEY:-}" ]; then
            echo "SOPS_AGE_KEY is not configured for this repository" >&2
            exit 1
          fi
          install -d -m 0700 "$HOME/.config/sops/age"
          printf '%s' "$SOPS_AGE_KEY" > "$HOME/.config/sops/age/keys.txt"
          chmod 0600 "$HOME/.config/sops/age/keys.txt"
          # A secret can exist and still be the wrong key — a truncated paste or
          # an identity from another project. Prove it decrypts this repository's
          # payload now, so the failure names the cause instead of surfacing as
          # sops noise inside render.
          if ! sops -d --extract '["DB_PASSWORD"]' deploy/secrets/secrets.enc.yaml >/dev/null; then
            echo "SOPS_AGE_KEY cannot decrypt deploy/secrets/secrets.enc.yaml" >&2
            echo "check that the secret holds the age identity whose public key is in .sops.yaml:" >&2
            grep -A1 'path_regex: deploy/secrets' .sops.yaml >&2 || true
            exit 1
          fi
          echo "age identity decrypts the dev payload"

      - name: Render Compose secrets
        run: |
          set -euo pipefail
          export SECRET_GID="$(id -g)"
          ./deploy/secrets/render.sh --env dev

          # Compose mounts these by name; a missing file fails the container at
          # start with a confusing message, so the pipeline checks first.
          for name in DB_PASSWORD REDIS_PASSWORD JWT_SECRET_KEY OAUTH_TOKEN_ENCRYPTION_KEY RESEND_API_KEY; do
            test -s "deploy/secrets/run/$name" || { echo "missing rendered secret: $name" >&2; exit 1; }
            mode="$(stat -c '%a' "deploy/secrets/run/$name")"
            [ "$mode" = "440" ] || { echo "$name has mode $mode, expected 440" >&2; exit 1; }
          done

          # Render output must never be committable.
          if [ -n "$(git status --porcelain)" ]; then
            echo "rendered secrets are not ignored by git" >&2
            git status --porcelain
            exit 1
          fi

  supply-chain:
    name: Secrets, vulnerabilities, SBOM and provenance
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: changes
    # Same fail-closed rule as the quality job: breaking the classifier must not
    # turn the gate off.
    if: always()
    steps:
      - name: Fail closed when the classifier did not finish
        if: needs.changes.result != 'success'
        run: |
          echo "the change classifier did not finish, so this gate cannot be skipped" >&2
          exit 1

      - uses: actions/checkout@v7
        if: needs.changes.outputs.code == 'true'
        with:
          fetch-depth: 0

      # The report lands before the exit code is decided: a red scan still has
      # to leave the evidence that explains it.
      # On a pull request only the commits under review can introduce a secret;
      # scanning the whole history there cost about a minute per run for nothing.
      # The branches still scan everything, because that is where a secret would
      # actually ship.
      - name: Scan the repository for committed secrets
        if: needs.changes.outputs.code == 'true'
        run: |
          set -euo pipefail
          mkdir -p build
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            log_opts=(--log-opts="${{ github.event.pull_request.base.sha }}..HEAD")
          else
            log_opts=()
          fi
          docker run --rm -v "$PWD:/repo" -w /repo "${GITLEAKS_IMAGE}" \
            detect --source . --redact --verbose --no-banner "${log_opts[@]}" \
            --report-format json --report-path /repo/build/gitleaks.json \
            --exit-code 1

      # Filesystem scan covers what an image scan cannot see: Dockerfiles,
      # compose files and the dependency manifests of the build itself.
      # `.agents/` is the agent workspace: develop only, never on master, never
      # shipped. Gating a merge on a scanner tool's lockfile would be noise, so
      # it is skipped explicitly rather than silently.
      - name: Scan the filesystem
        if: needs.changes.outputs.code == 'true'
        run: |
          docker run --rm -v "$PWD:/repo" "${TRIVY_IMAGE}" \
            fs --scanners vuln,secret,misconfig --severity HIGH,CRITICAL \
            --skip-dirs /repo/.agents --skip-dirs /repo/build \
            --format json --output /repo/build/trivy-fs.json \
            --exit-code 1 --no-progress /repo

      # One build produces both the image to scan and the provenance that names
      # it. Building twice would let the scanned digest and the attested digest
      # diverge, which defeats the point of the attestation.
      # BuildKit writes an archive while `trivy image --input` reads an unpacked
      # layout (an OCI tar fails with "file manifest.json not found in tar"), so
      # the pipeline unpacks one into the other. Both the scan and the
      # attestation then describe the same build.
      - uses: docker/setup-buildx-action@v4
        if: needs.changes.outputs.code == 'true'
        # Base images come from Docker Hub, whose anonymous pull limit is counted
        # per source address — the thing that makes a shared runner answer
        # "toomanyrequests" without warning. BuildKit tries the mirror first and
        # falls back to Docker Hub for anything it does not carry, so this is
        # additive rather than a new dependency.
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      - name: Build the image with provenance
        if: needs.changes.outputs.code == 'true'
        run: |
          set -euo pipefail
          mkdir -p build
          # `mode=max` is required, not a preference: `mode=min` exports only
          # layers of the final image, and the builder stage — where the dependency
          # download and the compile live — is not one of them, so every run
          # downloaded the whole graph again. The entry is larger; the repository
          # shares one 10 GB pool with Gradle's dependency cache.
          docker buildx build --provenance=mode=max \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --output "type=oci,dest=build/image.tar" \
            --metadata-file build/build-metadata.json \
            -t "${IMAGE_TAG}" .
          mkdir -p build/oci
          tar -xf build/image.tar -C build/oci

      - name: Extract the provenance attestation
        if: needs.changes.outputs.code == 'true'
        run: python3 .github/scripts/extract-provenance.py build/oci build/provenance.json

      # Severity filtering stays in one place: Trivy decides what counts, and
      # its exit code decides the job. Re-listing severities here would be a
      # second, silently diverging definition of "bad enough to block".
      - name: Scan the image
        if: needs.changes.outputs.code == 'true'
        run: |
          docker run --rm -v "$PWD:/repo" "${TRIVY_IMAGE}" \
            image "--input=/repo/build/oci" --scanners vuln \
            --severity HIGH,CRITICAL \
            --format json --output /repo/build/trivy-image.json \
            --exit-code 1 --no-progress

      - name: Generate the SBOM
        if: needs.changes.outputs.code == 'true'
        run: |
          docker run --rm -v "$PWD:/repo" "${TRIVY_IMAGE}" \
            image "--input=/repo/build/oci" \
            --format cyclonedx --output /repo/build/sbom.cdx.json --no-progress

      - name: Upload supply-chain evidence
        if: always() && needs.changes.outputs.code == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: supply-chain-${{ github.sha }}
          path: |
            build/gitleaks.json
            build/trivy-fs.json
            build/provenance.json
            build/build-metadata.json
            build/sbom.cdx.json
            build/trivy-image.json
          retention-days: 90
