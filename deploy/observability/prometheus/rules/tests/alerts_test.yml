# Unit tests for alerts.yml, run with:
#   promtool test rules deploy/observability/prometheus/rules/tests/alerts_test.yml
#
# They pin the behaviours that are easy to lose: a NaN gauge sample must fire
# the rule rather than silently pass, ordinary values must stay quiet, and the
# 5xx rule must ignore a ratio produced by almost no traffic. PromQL has no
# isnan(); a NaN is the one value that compares unequal to itself, which is the
# idiom these rules use.
rule_files:
  - ../alerts.yml

evaluation_interval: 1m

tests:
  - interval: 1m
    input_series:
      - series: cttserver_business_mail_pending_oldest_seconds
        values: 0+0x12
      - series: cttserver_business_leaderboard_pending_recomputes
        values: 0+0x12
    alert_rule_test:
      - eval_time: 10m
        alertname: MailOutboxStalled
        exp_alerts: []
      - eval_time: 10m
        alertname: LeaderboardRecomputeStalled
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: cttserver_business_mail_pending_oldest_seconds
        values: 400+0x12
    alert_rule_test:
      - eval_time: 4m
        alertname: MailOutboxStalled
        exp_alerts: []
      - eval_time: 8m
        alertname: MailOutboxStalled
        exp_alerts:
          - exp_labels:
              severity: info
            exp_annotations:
              summary: Mail backlog unreadable or oldest undelivered mail over 5 minutes old
              description: The oldest entry awaiting dispatch is either unmeasurable (the age query failed) or over 5 minutes old. The mail poller may be stuck. See docs/observability.md#alerting.

  - interval: 1m
    input_series:
      - series: cttserver_business_mail_pending_oldest_seconds
        values: NaN+0x12
    alert_rule_test:
      - eval_time: 8m
        alertname: MailOutboxStalled
        exp_alerts:
          - exp_labels:
              severity: info
            exp_annotations:
              summary: Mail backlog unreadable or oldest undelivered mail over 5 minutes old
              description: The oldest entry awaiting dispatch is either unmeasurable (the age query failed) or over 5 minutes old. The mail poller may be stuck. See docs/observability.md#alerting.

  - interval: 1m
    input_series:
      - series: cttserver_business_leaderboard_pending_recomputes
        values: 3+0x40
    alert_rule_test:
      - eval_time: 20m
        alertname: LeaderboardRecomputeStalled
        exp_alerts: []
      - eval_time: 35m
        alertname: LeaderboardRecomputeStalled
        exp_alerts:
          - exp_labels:
              severity: info
            exp_annotations:
              summary: Leaderboard recompute backlog unreadable or stale for 30 minutes
              description: Either the pending-recompute count could not be read, or users are waiting for a score recompute; rankings are stale. See docs/observability.md#alerting.

  - interval: 1m
    input_series:
      - series: cttserver_business_leaderboard_pending_recomputes
        values: NaN+0x40
    alert_rule_test:
      - eval_time: 35m
        alertname: LeaderboardRecomputeStalled
        exp_alerts:
          - exp_labels:
              severity: info
            exp_annotations:
              summary: Leaderboard recompute backlog unreadable or stale for 30 minutes
              description: Either the pending-recompute count could not be read, or users are waiting for a score recompute; rankings are stale. See docs/observability.md#alerting.

  # A single failure on an almost idle instance is a 100% ratio but not an SLO
  # breach: the traffic guard must keep the rule quiet.
  - interval: 1m
    input_series:
      - series: http_server_requests_seconds_count{status="500"}
        values: 0+1x12
      - series: http_server_requests_seconds_count{status="200"}
        values: 0+0x12
    alert_rule_test:
      - eval_time: 12m
        alertname: Http5xxRatioHigh
        exp_alerts: []

  # 1% of a busy instance is twice the 0.5% monthly SLO: the rule fires once
  # the ratio has held for the full `for:` window.
  - interval: 1m
    input_series:
      - series: http_server_requests_seconds_count{status="500"}
        values: 0+1x12
      - series: http_server_requests_seconds_count{status="200"}
        values: 0+99x12
    alert_rule_test:
      - eval_time: 3m
        alertname: Http5xxRatioHigh
        exp_alerts: []
      - eval_time: 12m
        alertname: Http5xxRatioHigh
        exp_alerts:
          - exp_labels:
              severity: info
            exp_annotations:
              summary: More than 0.5% of HTTP responses are 5xx
              description: 5xx ratio is 1% over the last 5 minutes, above the 0.5% monthly SLO. The guard needs roughly 30 requests in the window, so low traffic never fires this. See docs/observability.md#alerting.
