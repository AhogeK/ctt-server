# Gradle configuration
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=true

# Application configuration
kotlin.stdlib.default.dependency=false

# Artifact source. Maven Central answers 429 to shared CI addresses; the mirror
# below is a byte-identical, unauthenticated copy (checksums in
# gradle/verification-metadata.xml decide what is acceptable). Declared in
# settings.gradle.kts for dependency resolution only — plugin markers keep the
# Plugin Portal, whose POMs differ in bytes from Central's.
artifactMirrorUrl=https://maven-central.storage-download.googleapis.com/maven2/
