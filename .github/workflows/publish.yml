# Publishes the image that `ci.yml` proved, and signs it.
#
# The split is deliberate: `ci.yml` gates merges and builds a throwaway image to
# scan, while this workflow runs only on the commits that actually reach a
# deployable ref. Building here as well means the byte that gets a tag, a
# signature and a provenance attestation is the byte the receiving host pulls —
# a local `--build` on the deploy host would have no such claim.
#
# Keyless signing: the certificate is issued to this workflow's identity through
# GitHub's OIDC token, so there is no long-lived private key to store, rotate or
# leak. Verification therefore pins the identity and the issuer instead of a
# public key — see `deploy/verify-image.sh`.
name: Publish

on:
  push:
    branches: [master]
    tags: ["v*"]
  # Lets a branch build and sign a throwaway tag without merging, which is how
  # the signing path is exercised before it is trusted.
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    name: Build, push and sign
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      reference: ${{ steps.reference.outputs.value }}

    steps:
      # A registry path is lowercase by definition: `AhogeK/ctt-server` is a
      # valid repository name but not a valid image reference. The tags
      # metadata-action produces are already lowercase, so the reference that
      # gets signed has to be built the same way.
      - name: Resolve the image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to the container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # What the registry ends up holding:
      #   `sha-<short>` — the newest build of this commit. Two builds of one
      #     commit differ (the build is not byte-reproducible), so this tag can
      #     move; a digest is the immutable handle.
      #   `master` — the branch build, reachable without a release.
      #   `X.Y.Z` — the release: the `vX.Y.Z` git tag publishes the image tag
      #     without the `v`.
      #   `latest` — the newest release. `flavor: latest=false` stops the action
      #     from adding it on its own (it would add it for every semver tag);
      #     the explicit rule below adds it for a tag only, so an unreleased
      #     branch build never moves it.
      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=sha,format=short,prefix=sha-
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}

      # One build: the pushed image, its provenance and its SBOM all describe
      # the same bytes. `push: true` also means the registry holds it before
      # the signature is attempted, so a signature can never name a tag that
      # resolves to nothing.
      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_PORT=8080
          provenance: mode=min
          sbom: true

      - name: Fix the reference this run signed
        id: reference
        run: echo "value=${IMAGE}@${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"

      - uses: sigstore/cosign-installer@v3
        with:
          cosign-release: v2.6.0

      # `--yes` skips the "this will be published to a transparency log" prompt,
      # which is meaningless in an unattended run. The signature lands in the
      # Rekor transparency log, so a verifier can later establish that it was
      # made while the OIDC certificate was valid.
      - name: Sign the digest
        run: cosign sign --yes "${{ steps.reference.outputs.value }}"

      # BuildKit stores the provenance inside the image index, addressed to the
      # platform manifest rather than to the index this release signs, and
      # registries expose it in ways cosign cannot query: the publish run
      # proved that `cosign verify-attestation` reports "no matching
      # attestations" for an image that demonstrably carries one. Publishing
      # the same provenance as a cosign attestation attaches it to the digest
      # that was signed — the digest a deployment pulls and the one
      # `deploy/verify-image.sh` checks.
      #
      # `mode=min` for this build: the predicate ends up in the public Rekor
      # transparency log, and the maximal provenance carries the build
      # environment. The minimal one still binds the image to the commit.
      - name: Publish the provenance as a signed attestation
        env:
          BUILD_METADATA: ${{ steps.build.outputs.metadata }}
          REF: ${{ steps.reference.outputs.value }}
        run: |
          printf '%s' "$BUILD_METADATA" > build-metadata.json
          python3 .github/scripts/extract-predicate.py build-metadata.json provenance.json
          cosign attest --yes --predicate provenance.json --type slsaprovenance "$REF"

      # The same command the deployment runs: if this passes here, the gate on
      # the host has something real to check.
      - name: Attest the build provenance
        run: |
          cosign verify-attestation \
            --type slsaprovenance \
            --certificate-identity-regexp "https://github.com/${{ github.repository }}/.github/workflows/publish.yml@.*" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${{ steps.reference.outputs.value }}"

      - name: Summarise
        run: |
          {
            echo "### Published image"
            echo
            echo "\`${{ steps.reference.outputs.value }}\`"
            echo
            echo "Verify it anywhere with:"
            echo
            echo '```'
            echo "cosign verify \\"
            echo "  --certificate-identity-regexp 'https://github.com/${{ github.repository }}/.github/workflows/publish.yml@.*' \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com \\"
            echo "  ${{ steps.reference.outputs.value }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
