<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">CTT Server — sync and analytics backend for Code Time Tracker</title>
  <desc id="heroDesc">Dark banner: the project name and a three-station diagram in which Plugin A pushes a change into the server's change log and Plugin B pulls it by watermark.</desc>

  <defs>
    <marker id="arrowPush" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#2DD4BF"/>
    </marker>
    <marker id="arrowPull" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#60A5FA"/>
    </marker>
  </defs>

  <rect width="1200" height="300" rx="24" fill="#0B0F14"/>

  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <text x="64" y="80" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" letter-spacing="2.2" fill="#2DD4BF">SYNC ENGINE · STATISTICS · LEADERBOARD</text>
    <text x="62" y="150" font-size="64" font-weight="700" fill="#F4F7F9">CTT Server</text>
    <text x="64" y="196" font-size="22" fill="#C7D2DA">Cloud backend for Code Time Tracker:</text>
    <text x="64" y="226" font-size="22" fill="#C7D2DA">sync, statistics, leaderboards.</text>
    <text x="64" y="266" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#8A94A0">Java 25 · Spring Boot 4 · PostgreSQL · Redis</text>
  </g>

  <g id="sync-diagram" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <rect x="648" y="86" width="124" height="68" rx="12" fill="#111821" stroke="#223041" stroke-width="1.5"/>
    <text x="664" y="116" font-size="20" fill="#F4F7F9">Plugin A</text>
    <text x="664" y="140" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#8A94A0">SQLite</text>

    <rect x="816" y="68" width="160" height="106" rx="12" fill="#0F1A1D" stroke="#1F4A48" stroke-width="1.5"/>
    <text x="832" y="96" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#2DD4BF">change_log</text>
    <text x="832" y="126" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#C7D2DA">1042  upsert</text>
    <text x="832" y="152" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#C7D2DA">1043  delete</text>

    <rect x="1020" y="86" width="116" height="68" rx="12" fill="#111821" stroke="#223041" stroke-width="1.5"/>
    <text x="1036" y="116" font-size="20" fill="#F4F7F9">Plugin B</text>
    <text x="1036" y="140" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#8A94A0">SQLite</text>

    <line x1="772" y1="120" x2="812" y2="120" stroke="#2DD4BF" stroke-width="2" marker-end="url(#arrowPush)"/>
    <text x="770" y="106" font-size="18" fill="#2DD4BF">push</text>

    <line x1="976" y1="144" x2="1016" y2="144" stroke="#60A5FA" stroke-width="2" marker-end="url(#arrowPull)"/>
    <text x="978" y="132" font-size="18" fill="#60A5FA">pull</text>

    <text x="648" y="212" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#8A94A0">one change per accepted write</text>
    <text x="648" y="236" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#8A94A0">one cursor per device</text>
  </g>
</svg>
