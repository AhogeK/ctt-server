[versions]

appVersion = "0.87.3"
springBoot = "4.1.2"
springDependencyManagement = "1.1.7"
spotless = "8.10.4"
greenmail = "2.1.15"
springOpenapi = "3.2.0"
benManes = "0.66.0"
flyway = "13.11.1"
postgresql = "42.7.14"
junitPlatformLauncher = "6.1.3"

[libraries]

springdoc-openapi-starter-webmvc-ui = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springOpenapi" }
greenmail = { module = "com.icegreen:greenmail", version.ref = "greenmail" }
flyway-database-postgresql = { module = "org.flywaydb:flyway-database-postgresql", version.ref = "flyway" }
org-postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junitPlatformLauncher"}

[plugins]

spring-boot = { id = "org.springframework.boot", version.ref = "springBoot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "springDependencyManagement" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
ben-manes = { id = "io.github.ben-manes.versions", version.ref = "benManes" }
