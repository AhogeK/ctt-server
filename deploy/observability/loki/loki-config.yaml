# Loki for the deployment host (P1.4).
#
# Single binary, filesystem storage, 30-day retention enforced by the compactor
# (Loki deletes only what the compactor marks, so retention_enabled and the
# matching delete store are both required). Alloy pushes the container logs.

auth_enabled: false

server:
  http_listen_address: 127.0.0.1
  http_listen_port: 3100
  grpc_listen_address: 127.0.0.1
  grpc_listen_port: 9096
  log_level: info

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    # The first schema date must precede any data this stack writes.
    - from: 2024-04-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # 720h is the retention window; the same value appears in Tempo.
  retention_period: 720h
  # JSON logs from the application carry structured fields (traceId, level);
  # without this the labels could not be filtered as metadata.
  allow_structured_metadata: true
  volume_enabled: true

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

analytics:
  reporting_enabled: false
