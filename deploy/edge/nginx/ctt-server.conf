# Edge in front of the tunnel.
#
# TLS terminates here. Everything behind this block — frps, frpc, the Caddy edge
# and the application — speaks plain HTTP, so two headers have to carry the facts
# this server learned: who the client is, and that the caller used TLS. The
# application trusts them only when the immediate peer is listed in
# ctt.security.trusted-proxy-addresses (127.0.0.1 when it shares a host with the
# edge, the bridge gateway when it does not).
#
# Install: copy to /etc/nginx/sites-available/ctt-server.conf, symlink it into
# sites-enabled, run `nginx -t`, reload. Four values come from the host:
#
#   1. server_name              the public hostname
#   2. ssl_certificate[_key]    the certificate for that hostname
#   3. upstream ctt_edge        the tunnel's local end (frps listens on 18080)
#   4. client_max_body_size     keep equal to the Caddy edge's request_body
#
# `listen ... ssl http2` is used instead of the newer `http2 on;` directive so
# the file loads on nginx 1.18 (Ubuntu 22.04) as well as 1.25+; the latter only
# prints a deprecation warning. Check `nginx -v` before switching.
#
# HSTS is not set here: the application emits Strict-Transport-Security once it
# sees X-Forwarded-Proto: https (SecurityConfig), and a second declaration at
# this hop would be a second source of the same promise.

limit_req_zone $binary_remote_addr zone=ctt_api:10m rate=50r/s;

upstream ctt_edge {
    server 127.0.0.1:18080;   # the tunnel's local end
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name ctt.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ctt.example.com;

    ssl_certificate     /etc/letsencrypt/live/ctt.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ctt.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Do not advertise the version of the server answering.
    server_tokens off;

    # 4 MiB — the same bytes the Caddy edge enforces (request_body max_size in
    # deploy/local/Caddyfile). The largest legitimate body is a sync push of 1000
    # sessions whose free-text fields sit at their documented limits, about
    # 1.7 MiB before the JSON envelope, so a 2 MB ceiling would refuse a batch the
    # API accepts. Both hops state the same number because whichever answers 413
    # first makes the other look innocent.
    client_max_body_size 4194304;
    client_body_timeout 30s;
    client_header_timeout 10s;
    send_timeout 60s;

    # Shed floods here so they never occupy application threads. 50 r/s per
    # address is derived from the application's own ceiling: a sync push client is
    # allowed 10 r/s, and several people behind one NAT share a single
    # $binary_remote_addr, so ~5 concurrent clients is the point where a burst is
    # a flood rather than a workload. The application still enforces per-user
    # fairness; this layer only decides survivability.
    limit_req zone=ctt_api burst=100 nodelay;
    limit_req_status 429;

    # This log is the only place the full client address survives: the
    # application masks it before logging (RequestContextInitializerFilter). It is
    # what makes an edge problem debuggable, so it is kept — rotate it with the
    # other vhost logs.
    access_log /var/log/nginx/ctt-access.log combined;
    error_log /var/log/nginx/ctt-error.log warn;

    proxy_http_version 1.1;
    proxy_set_header Connection        "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    # Appends this client to whatever arrived, so the rightmost entry before our
    # own peer is the address the application rate-limits on. A prepended value
    # from the caller stays to the left and is ignored by the right-to-left scan.
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    # The caller used TLS even though this hop does not; without this the
    # application treats every request as insecure (non-Secure cookies).
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host  $host;

    proxy_connect_timeout 5s;
    proxy_send_timeout    30s;
    proxy_read_timeout    30s;

    # A dead upstream and a broken one both surface as "try again later"; 502 and
    # 504 would tell the caller which layer failed.
    error_page 502 504 = @maintenance;

    location / {
        proxy_pass http://ctt_edge;
    }

    location @maintenance {
        internal;
        default_type text/plain;
        return 503 "service temporarily unavailable\n";
    }
}
