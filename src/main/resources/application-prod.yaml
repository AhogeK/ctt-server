# Production Profile Configuration
# This file is activated by SPRING_PROFILES_ACTIVE=prod
# All sensitive credentials are injected via environment variables.

spring:
  # Database - Production PostgreSQL. Production must provide
  # DB_NAME=ctt_server_prod and DB_USERNAME=ctt_app; development keeps ctt_server.
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000

  # Flyway - Database migrations
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true

  # JPA - Production settings
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  # Redis - Production cache
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      timeout: 2000ms
      # db1 is occupied by another service in this Redis instance; ctt-server
      # uses db2 so production data cannot share a keyspace with it.
      database: ${REDIS_DATABASE:2}

  # Mail - Resend SMTP Relay (Production)
  # Username is literally "resend", not your account
  # API Key injected from environment variable, never hardcoded
  mail:
    host: smtp.resend.com
    port: 465
    username: resend
    password: ${RESEND_API_KEY}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true        # Port 465 uses SSL/TLS
          starttls:
            enable: false       # STARTTLS only for port 587
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

# API documentation is a development tool. Production answers 404 on both paths, and the startup
# guard rejects a configuration that re-enables it.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# Application - Production settings
server:
  # Graceful shutdown for zero-downtime deployments
  shutdown: graceful

# Security configuration for production
ctt:
  security:
    jwt:
      # JWT secret key from environment variable (256+ bits for HMAC-SHA256)
      secret-key: ${JWT_SECRET_KEY}
    two-factor:
      # No fallback in production: a missing key must stop the deployment, not silently encrypt
      # TOTP secrets with a value that is public in the repository.
      encryption-key: ${TOTP_ENCRYPTION_KEY}
    passkey:
      # The RP ID is a long-lived commitment. Changing it invalidates every registered passkey.
      rp-id: ${PASSKEY_RP_ID}
      allowed-origins: ${PASSKEY_ALLOWED_ORIGINS}
    password:
      # Production BCrypt rounds (12 rounds ≈ 250ms per hash)
      bcrypt-rounds: 12
    rate-limit:
      # Enable rate limiting in production
      enabled: true
      # Global QPS limit across all endpoints
      global-max-requests-per-second: 200

    cors:
      # Real browser origins only; the startup guard rejects localhost, wildcards and the
      # example.com placeholder.
      allowed-origins: ${CORS_ALLOWED_ORIGINS:${FRONTEND_BASE_URL}}
      allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:${FRONTEND_BASE_URL}}
    oauth:
      frontend-url: ${FRONTEND_BASE_URL}

  # Mail configuration for production
  mail:
    from:
      address: ${MAIL_FROM_ADDRESS}
      name: ${MAIL_FROM_NAME:CTT}
    outbox:
      poll-interval-ms: ${MAIL_OUTBOX_POLL_INTERVAL_MS:10000}
      batch-size: ${MAIL_OUTBOX_BATCH_SIZE:100}
      zombie-timeout-seconds: ${MAIL_OUTBOX_ZOMBIE_TIMEOUT_SECONDS:600}
    retry:
      base-delay-seconds: ${MAIL_RETRY_BASE_DELAY_SECONDS:30}
      multiplier: ${MAIL_RETRY_MULTIPLIER:2.0}
      max-delay-seconds: ${MAIL_RETRY_MAX_DELAY_SECONDS:7200}
      max-attempts: ${MAIL_RETRY_MAX_ATTEMPTS:7}

    frontend:
      # Email links must point at the deployed site, never at the development server.
      base-url: ${FRONTEND_BASE_URL}
  # Audit retention - the approved production policy (ADR-0002)
  audit:
    retention:
      # 180 days is the approved period. AUDIT_RETENTION_DAYS overrides it per environment and 0
      # stops deletion (the documented rollback). The base profile keeps every row.
      days: ${AUDIT_RETENTION_DAYS:180}

# Logging - Production level
logging:
  level:
    root: INFO
    com.ahogek.cttserver: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: WARN
