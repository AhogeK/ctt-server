name: Installer on clean runners

# Not wired to push or pull_request on purpose: this job downloads release
# binaries from GitHub on every run, and the point of running it is to hear what
# a *fresh* runner does — not to gate every commit. Run it from the Actions tab
# (workflow_dispatch) when scripts/install.sh changes, or before a release.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install:
    # Both runner images are stock: ubuntu-24.04 is glibc and GNU coreutils,
    # macos-15 is arm64 with BSD userland and shasum instead of sha256sum. The
    # two together cover the adapter branches the script switches on.
    name: ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-15]
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Report the environment
        run: |
          uname -s
          uname -m
          command -v sha256sum || echo "sha256sum absent (expected on macOS)"
          command -v shasum || echo "shasum absent (expected on Linux)"

      # One sequence for every runner: the same scripts/tests/install-probe.sh
      # the host and the matrix containers execute, unit tests included. The
      # steps this replaces were a hand-kept copy of it — the copy had already
      # drifted (no exit-2 assertion) while the containers carried the real one.
      - name: The sequence the local matrix runs
        run: ./scripts/tests/install-probe.sh
