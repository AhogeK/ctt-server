# Local-only full stack: edge + blue/green + observability.
#
# One command (blue colour + edge, the default acceptance path):
#   ./deploy/local/up.sh
#   curl -s http://127.0.0.1:18080/ctt-server/actuator/health/readiness
#
# Read this file only through that script: the local image packages a jar that
# the script builds and stages in build/local-image/, so a bare
# `docker compose ... up --build` cannot work on a clean checkout.
#
# Optional profiles:
#   --profile bluegreen  start the second colour (app-green on 127.0.0.1:18082)
#   --profile obs        Prometheus + Grafana + blackbox exporter
#
# Edge, blue, green and the observability services use host networking and bind
# only loopback. The application therefore sees the edge as 127.0.0.1, which is
# what makes TRUSTED_PROXY_ADDRESSES=127.0.0.1 meaningful. Keep these services
# on host networking unless the trust-chain test is reworked.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Mirrors the base file: every service is read-only, drops all capabilities and
# may not gain privileges. The two colours inherit the same block through
# `extends`, so only the services defined here repeat it.
x-hardening: &hardening
  restart: unless-stopped
  stop_grace_period: 45s
  read_only: true
  logging: *default-logging
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

x-app-host-env: &app-host-env
  SERVER_ADDRESS: 127.0.0.1
  TRUSTED_PROXY_ADDRESSES: 127.0.0.1
  SPRING_DATASOURCE_URL: jdbc:postgresql://127.0.0.1:${POSTGRES_EXTERNAL_PORT:-15432}/${POSTGRES_DB:-ctt_server}
  SPRING_DATA_REDIS_HOST: 127.0.0.1
  SPRING_DATA_REDIS_PORT: ${REDIS_EXTERNAL_PORT:-16379}
  SPRING_MAIL_HOST: 127.0.0.1
  SPRING_MAIL_PORT: ${MAIL_SMTP_EXTERNAL_PORT:-1025}

services:
  app:
    profiles: !override ["standalone"]
  app-blue:
    extends:
      file: docker-compose.yaml
      service: app
    container_name: ctt-app-blue
    # The jar is built on the host first (build/libs, see deploy/local/up.sh):
    # the in-container Gradle build cannot reach Maven Central through this
    # host's proxy, so the local image only packages the jar.
    network_mode: host
    ports: !reset []
    environment:
      <<: *app-host-env
      SERVER_PORT: "18081"
      APP_PORT: "18081"
    build:
      dockerfile: deploy/local/Dockerfile
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:18081/ctt-server/actuator/health/readiness || exit 1"]
  app-green:
    extends:
      file: docker-compose.yaml
      service: app
    profiles: ["bluegreen"]
    container_name: ctt-app-green
    network_mode: host
    ports: !reset []
    environment:
      <<: *app-host-env
      SERVER_PORT: "18082"
      APP_PORT: "18082"
    build:
      dockerfile: deploy/local/Dockerfile
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:18082/ctt-server/actuator/health/readiness || exit 1"]

  edge:
    <<: *hardening
    image: caddy:latest
    container_name: ctt-edge
    network_mode: host
    ports: !reset []
    depends_on:
      app-blue:
        condition: service_healthy
    mem_limit: 128m
    cpus: 0.5
    tmpfs:
      - /tmp
    environment:
      UPSTREAM: ${EDGE_UPSTREAM:-127.0.0.1:18081}
    volumes:
      - ./deploy/local/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  # --- observability (profile: obs) -------------------------------------
  # Loki, Tempo and Alertmanager belong to P1.4/P2; this profile is the
  # smallest stack that proves scraping works locally. Every service image is
  # `latest` on purpose (project preference: always newest, majors included);
  # record the digests with `docker inspect` when a deploy needs to be pinned
  # after the fact.

  prometheus:
    <<: *hardening
    image: prom/prometheus:latest
    profiles: ["obs"]
    container_name: ctt-prometheus
    network_mode: host
    ports: !reset []
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
      - --web.listen-address=127.0.0.1:9090
    mem_limit: 384m
    cpus: 1.0
    tmpfs:
      - /tmp
    volumes:
      - ./deploy/local/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

  grafana:
    <<: *hardening
    image: grafana/grafana:latest
    # First start takes about three minutes: Grafana 13 installs the app
    # platform APIs one by one before it binds :3000. Subsequent starts are
    # faster because that state is in the volume.
    profiles: ["obs"]
    container_name: ctt-grafana
    network_mode: host
    ports: !reset []
    depends_on:
      - prometheus
    mem_limit: 768m
    cpus: 1.0
    group_add:
      - "${SECRET_GID:-1000}"
    tmpfs:
      - /tmp
    environment:
      # Host networking is bound to loopback by these settings; the image
      # never leaves this machine, so the anonymous session is an editor.
      GF_SERVER_HTTP_ADDR: 127.0.0.1
      GF_SERVER_HTTP_PORT: "3000"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      # No outbound calls: the plugin preinstaller and the update check block
      # startup for minutes when grafana.com is unreachable behind a proxy.
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
    secrets:
      - grafana_admin_password
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deploy/local/grafana-datasource.yml:/etc/grafana/provisioning/datasources/prometheus.yml:ro
      - ./deploy/local/grafana-dashboard-provider.yml:/etc/grafana/provisioning/dashboards/ctt.yml:ro
      - ./deploy/local/grafana-dashboard.json:/var/lib/grafana/dashboards/ctt-local.json:ro

  blackbox:
    <<: *hardening
    image: prom/blackbox-exporter:latest
    profiles: ["obs"]
    container_name: ctt-blackbox
    network_mode: host
    ports: !reset []
    command:
      - --config.file=/etc/blackbox_exporter/config.yml
      - --web.listen-address=127.0.0.1:9115
    mem_limit: 96m
    cpus: 0.5
    tmpfs:
      - /tmp

volumes:
  caddy_data:
  caddy_config:
  prometheus_data:
  grafana_data:
