spring:
  application:
    name: ctt-server

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  config:
    # Import .env file for local development (optional, skipped if not found)
    import: optional:file:.env[.properties]

  lifecycle:
    timeout-per-shutdown-phase: 30s

  mail:
    host: ${MAIL_SMTP_HOST:localhost}
    port: ${MAIL_SMTP_PORT:1025}
    username: ${MAIL_SMTP_USERNAME:}
    password: ${MAIL_SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

  jackson:
    time-zone: UTC
    default-property-inclusion: non_null

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          # Merge JDBC INSERT/UPDATE statements into batches (sync push hot path).
          batch_size: 50
        order_inserts: true
        order_updates: true
  datasource:
    hikari:
      data-source-properties:
        # Rewrite JDBC executeBatch into multi-row INSERT ... VALUES (...), (...) on PostgreSQL,
        # so the batched statements become a handful of real INSERT statements.
        reWriteBatchedInserts: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /ctt-server
  shutdown: graceful
  compression:
    # Negotiated only, never forced: a client that sends no Accept-Encoding receives exactly the
    # bytes it receives today. That is what makes this safe for the JetBrains plugin — the JDK
    # HttpClient it uses sends no Accept-Encoding and does not decompress, so a server that
    # compressed unconditionally would hand it gzip bytes it would try to parse as JSON. Browsers
    # and the web frontend opt in per request. Responses that carry a token (login, refresh) also
    # carry no attacker-controlled content, so the BREACH precondition — a secret and attacker
    # input in one compressed body — does not hold.
    enabled: true
    mime-types: application/json,text/plain
    min-response-size: 2KB

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
      group:
        liveness:
          include:
            - livenessState
        readiness:
          include:
            - readinessState
            - db
            - redis
  info:
    env:
      enabled: true

info:
  app:
    name: ctt-server
    version: @appVersion@

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

ctt:
  terms:
    current-version: "1.0.0"
    terms-accept-path: "/api/v1/auth/terms/accept"

  audit:
    retention:
      # Zero keeps every audit row; the production profile defaults this to 180 (ADR-0002).
      days: ${AUDIT_RETENTION_DAYS:0}
      batch-size: ${AUDIT_RETENTION_BATCH_SIZE:1000}
      sweep-interval-ms: ${AUDIT_RETENTION_SWEEP_INTERVAL_MS:3600000}
      initial-delay-ms: ${AUDIT_RETENTION_INITIAL_DELAY_MS:3600000}
  security:
    # Only these exact reverse-proxy IPs may supply X-Forwarded-For/X-Real-IP.
    trusted-proxy-addresses: ${TRUSTED_PROXY_ADDRESSES:}
    jwt:
      secret-key: ${JWT_SECRET_KEY}
      issuer: "ctt-identity-provider"
      access-token-ttl: 15m
      refresh-token-ttl-plugin: 14d
      refresh-token-ttl-web: 30d

    password:
      bcrypt-rounds: 12
      max-failed-attempts: 5
      lock-duration: 30m
      failure-window-seconds: 900  # 15 minutes sliding window
      retention-duration: PT720H  # 30 days - how long to keep login attempt records
      storage: DB  # or REDIS for distributed systems

    rate-limit:
      enabled: true
      global-max-requests-per-second: 200

    cors:
      allowed-origins:
        - "http://localhost:5173"
      allowed-origin-patterns:
        - "http://localhost:5173"
      allowed-methods:
        - "GET"
        - "POST"
        - "PUT"
        - "DELETE"
        - "PATCH"
        - "OPTIONS"
      allowed-headers:
        - "Authorization"
        - "Content-Type"
        - "X-Requested-With"
        - "Accept"
        - "Origin"
      exposed-headers:
        - "Authorization"
      allow-credentials: true
      max-age: 3600

    oauth:
      frontend-url: "${FRONTEND_BASE_URL:http://localhost:5173}"
      token-encryption-key: "${OAUTH_TOKEN_ENCRYPTION_KEY}"
      github:
        client-id: "${GITHUB_CLIENT_ID:}"
        client-secret: "${GITHUB_CLIENT_SECRET:}"

    cookie:
      # Path attribute for the refresh token cookie; scope it narrowly to the refresh endpoint
      refresh-token-path: ${REFRESH_TOKEN_PATH:/api/v1/auth/refresh}

    api-key:
      header-name: Authorization
      header-prefix: Bearer
      max-keys-per-user: 20
      auth-failure-rate-limit: 10
      auth-failure-rate-limit-window-seconds: 60

    two-factor:
      issuer: "Code Time Tracker"
      # Dev-only fallback, mirroring the JWT key above. The prod profile removes the fallback so a
      # missing key fails fast instead of silently encrypting with a public value.
      encryption-key: ${TOTP_ENCRYPTION_KEY:TE9DQUxfREVWX1RPVFBfS0VZX05PVF9GT1JfUFJPRFg=}
      digits: 6
      period-seconds: 30
      window-steps: 1
      pending-setup-ttl: 10m
      challenge-ttl: 5m
      recent-authentication-window: 10m
      recovery-code-count: 10

    passkey:
      rp-name: "Code Time Tracker"
      rp-id: ${PASSKEY_RP_ID:localhost}
      allowed-origins: ${PASSKEY_ALLOWED_ORIGINS:http://localhost:5173}
      challenge-ttl: 5m
      timeout: 5m
      new-credential-delay: 0s

    hcaptcha:
      site-key: ${HCAPTCHA_SITE_KEY:}
      secret-key: ${HCAPTCHA_SECRET_KEY:}
      verify-url: https://api.hcaptcha.com/siteverify
      timeout: 5s

  sync:
    # Maximum change-log entries returned per sync pull; clients page with nextCursor
    pull-batch-size: ${SYNC_PULL_BATCH_SIZE:1000}

  mail:
    from:
      address: ${MAIL_FROM_ADDRESS:noreply@localhost}
      name: ${MAIL_FROM_NAME:Code Time Tracker}

    outbox:
      # Polling interval for outbox table (milliseconds)
      poll-interval-ms: ${MAIL_OUTBOX_POLL_INTERVAL_MS:5000}
      # Maximum emails to fetch and send per batch
      batch-size: ${MAIL_OUTBOX_BATCH_SIZE:50}
      # Timeout in seconds to reset stuck SENDING emails to PENDING
      zombie-timeout-seconds: ${MAIL_OUTBOX_ZOMBIE_TIMEOUT_SECONDS:300}
      # Interval for zombie recovery task (milliseconds)
      zombie-interval-ms: ${MAIL_OUTBOX_ZOMBIE_INTERVAL_MS:120000}

    retry:
      # Base delay in seconds for first retry
      base-delay-seconds: ${MAIL_RETRY_BASE_DELAY_SECONDS:10}
      # Exponential backoff multiplier (base * multiplier^n)
      multiplier: ${MAIL_RETRY_MULTIPLIER:2.0}
      # Maximum delay cap in seconds
      max-delay-seconds: ${MAIL_RETRY_MAX_DELAY_SECONDS:3600}
      # Maximum retry attempts before marking as CANCELLED
      max-attempts: ${MAIL_RETRY_MAX_ATTEMPTS:5}
      # Jitter factor for retry time randomization (0.1 = ±10%)
      jitter-factor: ${MAIL_RETRY_JITTER_FACTOR:0.1}

    frontend:
      base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
      verify-email-path: /auth/verify-email
      reset-password-path: /auth/reset-password
      change-email-path: /auth/change-email

