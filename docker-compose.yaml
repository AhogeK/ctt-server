# Docker Compose - Local Development Infrastructure
# Provides: PostgreSQL, Redis, Mailpit (SMTP sandbox), CTT Server (app)
# Usage: docker compose up -d
# Prerequisites: Copy .env.example to .env and customize passwords

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Applied to every service. A container has no reason to gain privileges, keep
# capabilities it never uses, or write outside its volumes.
x-hardening: &hardening
  restart: unless-stopped
  stop_grace_period: 45s
  read_only: true
  logging: *default-logging
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

# Values live on the host as 0400 files rendered from the SOPS payload
# (`deploy/secrets/render.sh`); nothing secret is passed through the
# environment, so `docker inspect` shows no credential.
secrets:
  postgres_password:
    file: deploy/secrets/run/POSTGRES_PASSWORD
  redis_password:
    file: deploy/secrets/run/REDIS_PASSWORD
  jwt_secret_key:
    file: deploy/secrets/run/JWT_SECRET_KEY
  oauth_token_encryption_key:
    file: deploy/secrets/run/OAUTH_TOKEN_ENCRYPTION_KEY
  grafana_admin_password:
    file: deploy/secrets/run/GRAFANA_ADMIN_PASSWORD

services:
  app:
    <<: *hardening
    image: ctt-server-app
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_PORT: ${APP_PORT:-8080}
    container_name: ${CONTAINER_NAME:-ctt-server}
    mem_limit: 900m
    cpus: 2.0
    tmpfs:
      - /tmp
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_EXTERNAL_PORT:-8080}:${APP_PORT:-8080}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: local
      # configtree turns /run/secrets/<NAME> into a property of the same name,
      # so the existing ${DB_PASSWORD} / ${JWT_SECRET_KEY} placeholders resolve.
      SPRING_CONFIG_IMPORT: optional:configtree:/run/secrets/
      SERVER_PORT: ${APP_PORT:-8080}
      APP_PORT: ${APP_PORT:-8080}
      SPRING_DATASOURCE_URL: jdbc:postgresql://ctt-postgres:5432/${POSTGRES_DB:-ctt_server}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-ctt}
      SPRING_DATA_REDIS_HOST: ctt-redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_MAIL_HOST: ctt-mailpit
      SPRING_MAIL_PORT: 1025
    secrets:
      - source: postgres_password
        target: DB_PASSWORD
      - source: redis_password
        target: REDIS_PASSWORD
      - source: jwt_secret_key
        target: JWT_SECRET_KEY
      - source: oauth_token_encryption_key
        target: OAUTH_TOKEN_ENCRYPTION_KEY
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:${APP_PORT}/ctt-server/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  postgres:
    <<: *hardening
    image: postgres:latest
    container_name: ctt-postgres
    mem_limit: 768m
    cpus: 2.0
    tmpfs:
      - /tmp
      - /var/run/postgresql
    # The entrypoint chowns PGDATA and drops to the postgres user, so it needs
    # exactly these capabilities back; nothing else.
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ctt_server}
      POSTGRES_USER: ${POSTGRES_USER:-ctt}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    ports:
      - "${POSTGRES_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_EXTERNAL_PORT:-15432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql   # PostgreSQL 18+ requires parent directory
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ctt} -d ${POSTGRES_DB:-ctt_server}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    <<: *hardening
    image: redis:latest
    container_name: ctt-redis
    mem_limit: 256m
    cpus: 1.0
    tmpfs:
      - /tmp
      # The image declares no volume and keeps its working directory in the
      # root filesystem; the cache stays ephemeral either way.
      - /data
    # The image entrypoint drops privileges only when the command starts with
    # redis-server, so this wrapper writes a config on tmpfs, hands it to the
    # redis user and execs the real server: the password stays out of `ps`.
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETPCAP
      - SETUID
    command:
      - sh
      - -c
      - |
        umask 077
        printf 'requirepass %s\n' "$$(cat /run/secrets/redis_password)" > /tmp/redis.conf
        chown redis:redis /tmp/redis.conf
        exec setpriv --reuid=redis --regid=redis --init-groups redis-server /tmp/redis.conf
    secrets:
      - redis_password
    ports:
      - "${REDIS_BIND_ADDRESS:-127.0.0.1}:${REDIS_EXTERNAL_PORT:-16379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$(cat /run/secrets/redis_password)\" redis-cli ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  mailpit:
    <<: *hardening
    image: axllent/mailpit:latest
    container_name: ctt-mailpit
    # The owner keeps Mailpit running between sessions; the hardening anchor
    # carries restart: unless-stopped so a Docker restart cannot leave it down.
    mem_limit: 256m
    cpus: 1.0
    tmpfs:
      - /tmp
    ports:
      - "${MAIL_BIND_ADDRESS:-127.0.0.1}:${MAIL_SMTP_EXTERNAL_PORT:-1025}:1025"   # SMTP — spring.mail.port
      - "${MAIL_BIND_ADDRESS:-127.0.0.1}:${MAIL_UI_EXTERNAL_PORT:-8025}:8025"     # Web UI — http://localhost:8025
    volumes:
      - mailpit_data:/data   # Persistent email storage
    environment:
      MP_DATABASE: /data/mailpit.db          # SQLite database path
      MP_MAX_MESSAGES: 500                   # Max messages to retain (auto-prune older)
      MP_SMTP_AUTH_ACCEPT_ANY: 1             # Accept any username/password
      MP_SMTP_AUTH_ALLOW_INSECURE: 1         # Allow plaintext auth (no TLS required locally)
      MP_UI_AUTH_FILE: ""                    # No web UI authentication (local dev only)
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8025/livez || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  postgres_data:
  mailpit_data:
