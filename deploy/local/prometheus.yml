# Local Prometheus. The application exposes its metrics on the management port of each slot
# (8081 blue, 8082 green), which listens on the loopback interface only. Blackbox probes cover
# the public path through the edge and the readiness endpoint of each slot.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: ctt-server
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["127.0.0.1:8081"]
        labels:
          slot: blue
      - targets: ["127.0.0.1:8082"]
        labels:
          slot: green

  # Two probe jobs, named as on the deployment host: the dashboards and alert rules
  # address probes by job, so the same panel reads the same series in both stacks.
  - job_name: blackbox-public
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      # Public path through the edge: proves the proxy forwards to the application.
      - targets: ["http://127.0.0.1:18080/ctt-server/api/v1/config/public"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 127.0.0.1:9115

  # Readiness is probed with a plain module so a 200 is the only success: the
  # endpoint answers 503 while a slot drains, and a redirect must not count.
  - job_name: blackbox-readiness
    metrics_path: /probe
    params:
      module: [http_2xx_plain]
    static_configs:
      - targets: ["http://127.0.0.1:8081/actuator/health/readiness"]
      - targets: ["http://127.0.0.1:8082/actuator/health/readiness"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 127.0.0.1:9115
