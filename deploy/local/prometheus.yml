# Local Prometheus. The app does not expose a metrics endpoint yet (P1.1);
# until then this scrapes itself and probes the two HTTP endpoints through
# blackbox_exporter, which is enough to prove the stack is wired.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: blackbox-http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://edge:18080/ctt-server/actuator/health
          - http://app-blue:8080/ctt-server/actuator/health
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
